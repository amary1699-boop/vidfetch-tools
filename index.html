<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VidFetch - Video Downloader</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:18px 20px;
}

.logo{
  max-width:850px;
  margin:auto;
  font-size:25px;
  font-weight:700;
  color:#2563eb;
}

main{
  max-width:760px;
  margin:65px auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:30px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  margin:0 0 10px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:28px;
}

.input-row{
  display:flex;
  gap:10px;
}

#videoUrl{
  flex:1;
  height:50px;
  padding:0 15px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

#videoUrl:focus{
  border-color:#2563eb;
}

#getVideoBtn{
  height:50px;
  padding:0 22px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

#getVideoBtn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#status{
  text-align:center;
  margin-top:18px;
  min-height:20px;
}

.error{
  color:#dc2626;
}

.success{
  color:#16a34a;
}

#result{
  display:none;
  margin-top:30px;
}

#videoThumbnail{
  width:100%;
  border-radius:12px;
  display:none;
  max-height:400px;
  object-fit:cover;
}

#videoTitle{
  font-size:20px;
  font-weight:700;
  line-height:1.4;
  margin:18px 0;
}

.quality-title{
  font-size:17px;
  font-weight:700;
  margin-bottom:12px;
}

#qualities{
  display:grid;
  gap:10px;
}

.quality-btn{
  width:100%;
  min-height:52px;
  padding:0 16px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  font-size:15px;
}

.quality-btn:hover{
  border-color:#2563eb;
  background:#eff6ff;
}

.quality-name{
  font-weight:700;
}

.download-label{
  color:#2563eb;
  font-weight:600;
}

@media(max-width:650px){

  main{
    margin:35px auto;
    padding:14px;
  }

  .card{
    padding:20px;
  }

  h1{
    font-size:27px;
  }

  .input-row{
    flex-direction:column;
  }

  #getVideoBtn{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">VidFetch</div>
</header>

<main>

  <div class="card">

    <h1>Video Downloader</h1>

    <div class="subtitle">
      Download authorized video files
    </div>

    <div class="input-row">

      <input
        id="videoUrl"
        type="url"
        placeholder="Paste video URL"
        autocomplete="off"
      >

      <button id="getVideoBtn">
        Get Video
      </button>

    </div>

    <div id="status"></div>

    <div id="result">

      <img
        id="videoThumbnail"
        alt="Video thumbnail"
      >

      <div id="videoTitle"></div>

      <div class="quality-title">
        Available Quality
      </div>

      <div id="qualities"></div>

    </div>

  </div>

</main>

<script>

const API =
  "https://vidfetch-api.amary1699.workers.dev";

const videoUrl =
  document.getElementById("videoUrl");

const getVideoBtn =
  document.getElementById("getVideoBtn");

const statusBox =
  document.getElementById("status");

const result =
  document.getElementById("result");

const thumbnail =
  document.getElementById("videoThumbnail");

const title =
  document.getElementById("videoTitle");

const qualities =
  document.getElementById("qualities");


function status(message,type=""){

  statusBox.textContent =
    message;

  statusBox.className =
    type;

}


function clearResult(){

  result.style.display =
    "none";

  thumbnail.style.display =
    "none";

  thumbnail.removeAttribute(
    "src"
  );

  title.textContent =
    "";

  qualities.innerHTML =
    "";

}


function addQuality(format){

  const button =
    document.createElement("button");

  button.className =
    "quality-btn";

  const name =
    document.createElement("span");

  name.className =
    "quality-name";

  name.textContent =
    format.quality;

  const download =
    document.createElement("span");

  download.className =
    "download-label";

  download.textContent =
    "Download";

  button.appendChild(name);

  button.appendChild(download);

  button.onclick =
    function(){

      if(!format.url){

        status(
          "Download URL unavailable.",
          "error"
        );

        return;
      }

      /*
       * Use our Worker download endpoint.
       */

      const downloadUrl =
        API +
        "/download?quality=" +
        encodeURIComponent(
          format.quality
        );

      window.location.href =
        downloadUrl;

    };

  qualities.appendChild(
    button
  );

}


async function analyze(){

  const input =
    videoUrl.value.trim();

  clearResult();

  if(!input){

    status(
      "Please enter a video URL.",
      "error"
    );

    return;
  }

  getVideoBtn.disabled =
    true;

  getVideoBtn.textContent =
    "Loading...";

  status(
    "Getting video information..."
  );

  try{

    const response =
      await fetch(
        API +
        "/analyze?url=" +
        encodeURIComponent(input)
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Unable to get video."
      );

    }

    title.textContent =
      data.title ||
      "Video";

    if(data.thumbnail){

      thumbnail.src =
        data.thumbnail;

      thumbnail.style.display =
        "block";

    }

    if(
      !Array.isArray(
        data.formats
      ) ||
      data.formats.length === 0
    ){

      throw new Error(
        "No downloadable quality available."
      );

    }

    data.formats.forEach(
      addQuality
    );

    result.style.display =
      "block";

    status(
      "Video ready.",
      "success"
    );

  }catch(error){

    console.error(error);

    status(
      error.message ||
      "Something went wrong.",
      "error"
    );

  }finally{

    getVideoBtn.disabled =
      false;

    getVideoBtn.textContent =
      "Get Video";

  }

}


getVideoBtn.addEventListener(
  "click",
  analyze
);


videoUrl.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      analyze();

    }

  }
);

</script>

</body>
</html>
