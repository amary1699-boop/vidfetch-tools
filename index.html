<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VidFetch - Video Downloader</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  padding:18px 20px;
}

.logo{
  max-width:900px;
  margin:auto;
  font-size:24px;
  font-weight:700;
  color:#2563eb;
}

main{
  max-width:760px;
  margin:70px auto;
  padding:20px;
}

.card{
  background:#ffffff;
  border-radius:16px;
  padding:30px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
  margin:0 0 10px;
  text-align:center;
  font-size:32px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:30px;
}

.input-row{
  display:flex;
  gap:10px;
}

#videoUrl{
  flex:1;
  min-width:0;
  height:50px;
  padding:0 15px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

#videoUrl:focus{
  border-color:#2563eb;
}

#getVideoBtn{
  height:50px;
  padding:0 22px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

#getVideoBtn:hover{
  background:#1d4ed8;
}

#status{
  margin-top:18px;
  text-align:center;
  color:#6b7280;
}

#result{
  display:none;
  margin-top:30px;
}

.thumbnail{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:12px;
  display:block;
}

#videoTitle{
  font-size:20px;
  font-weight:700;
  margin:18px 0;
  line-height:1.4;
}

.quality-title{
  font-size:17px;
  font-weight:700;
  margin:20px 0 12px;
}

#qualities{
  display:grid;
  gap:10px;
}

.quality-btn{
  width:100%;
  min-height:48px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  font-size:15px;
}

.quality-btn:hover{
  border-color:#2563eb;
  background:#eff6ff;
}

.quality-name{
  font-weight:700;
}

.download-text{
  color:#2563eb;
  font-weight:600;
}

.error{
  color:#dc2626 !important;
}

.success{
  color:#16a34a !important;
}

@media(max-width:650px){

  main{
    margin:35px auto;
    padding:14px;
  }

  .card{
    padding:20px;
  }

  h1{
    font-size:26px;
  }

  .input-row{
    flex-direction:column;
  }

  #getVideoBtn{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">VidFetch</div>
</header>

<main>

  <div class="card">

    <h1>Video Downloader</h1>

    <div class="subtitle">
      Download authorized video files
    </div>

    <div class="input-row">

      <input
        id="videoUrl"
        type="url"
        placeholder="Paste video URL"
        autocomplete="off"
      >

      <button id="getVideoBtn">
        Get Video
      </button>

    </div>

    <div id="status"></div>

    <div id="result">

      <img
        id="videoThumbnail"
        class="thumbnail"
        alt="Video thumbnail"
      >

      <div id="videoTitle"></div>

      <div class="quality-title">
        Available Quality
      </div>

      <div id="qualities"></div>

    </div>

  </div>

</main>

<script>

const API_URL =
  "https://vidfetch-api.amary1699.workers.dev";

const videoUrlInput =
  document.getElementById("videoUrl");

const getVideoBtn =
  document.getElementById("getVideoBtn");

const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const thumbnail =
  document.getElementById("videoThumbnail");

const videoTitle =
  document.getElementById("videoTitle");

const qualitiesBox =
  document.getElementById("qualities");


function setStatus(message, type = ""){

  statusBox.textContent = message;

  statusBox.className = type;

}


function resetResult(){

  resultBox.style.display = "none";

  thumbnail.removeAttribute("src");

  videoTitle.textContent = "";

  qualitiesBox.innerHTML = "";

}


function createQualityButton(format){

  const button =
    document.createElement("button");

  button.className = "quality-btn";

  const quality =
    document.createElement("span");

  quality.className = "quality-name";

  quality.textContent =
    format.quality || "Video";

  const download =
    document.createElement("span");

  download.className = "download-text";

  download.textContent = "Download";

  button.appendChild(quality);

  button.appendChild(download);

  button.addEventListener("click", () => {

    if(!format.url){

      setStatus(
        "Download URL is not available.",
        "error"
      );

      return;
    }

    const a =
      document.createElement("a");

    a.href = format.url;

    a.download =
      format.filename ||
      "video";

    a.target = "_blank";

    a.rel = "noopener";

    document.body.appendChild(a);

    a.click();

    a.remove();

  });

  qualitiesBox.appendChild(button);

}


async function getVideo(){

  const url =
    videoUrlInput.value.trim();

  resetResult();

  if(!url){

    setStatus(
      "Please enter a video URL.",
      "error"
    );

    return;
  }

  getVideoBtn.disabled = true;

  getVideoBtn.textContent =
    "Loading...";

  setStatus("Getting video information...");

  try{

    const response =
      await fetch(
        API_URL +
        "/analyze?url=" +
        encodeURIComponent(url)
      );

    const data =
      await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.error ||
        "Unable to get video information."
      );

    }

    if(!data.title){

      throw new Error(
        "Video title was not returned."
      );

    }

    videoTitle.textContent =
      data.title;

    if(data.thumbnail){

      thumbnail.src =
        data.thumbnail;

      thumbnail.style.display =
        "block";

    }else{

      thumbnail.style.display =
        "none";

    }

    const formats =
      Array.isArray(data.formats)
        ? data.formats
        : [];

    if(formats.length === 0){

      throw new Error(
        "No authorized downloadable formats are available."
      );

    }

    formats.forEach(
      createQualityButton
    );

    resultBox.style.display =
      "block";

    setStatus(
      "Video information loaded.",
      "success"
    );

  }catch(error){

    console.error(error);

    setStatus(
      error.message ||
      "Something went wrong.",
      "error"
    );

  }finally{

    getVideoBtn.disabled = false;

    getVideoBtn.textContent =
      "Get Video";

  }

}


getVideoBtn.addEventListener(
  "click",
  getVideo
);


videoUrlInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      getVideo();

    }

  }
);

</script>

</body>
</html>
